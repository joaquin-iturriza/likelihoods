# ATLAS-SUSY-2018-16 EWKinos: the winning trial of rafalmerged_ewkinos_001 (hp_0210),
# retrained with its exact hyperparameters for 150k steps (the sweep ran 200k), keeping the checkpoint with the lowest
# validation loss (the heteroscedastic NLL it trains on). The sweep had kept the
# final model instead (es_load_best_model: false), which was never asked for.
model:
  _target_: wrappers.AmplitudeMLPWrapper
  net:
    _target_: models.mup_mlp.MuMLP
    n_features: 0
    hidden_channels: 64
    hidden_layers: 5
    out_shape: 4
    loss: MSE
    gain: 1
    init_bias: true
    dropout_prob: 0
    batchnorm: false
    BN_eps: 1.0e-05
    BN_momentum: 0.1
    activation: gelu
    num_groups: 1
    out_soft_bound: false
exp_name: rafalmerged_best
exp_type: nLLs
run_name: ewkinos_hp0210_150k
base_dir: ${oc.env:PROJECT_DIR,.}
jobid: null
seed: null
debug: false
warm_start_idx: null
warm_start_dir: null
run_dir: null
save: true
use_mlflow: false
save_source: true
ema: false
ga_settings:
  use_fully_connected_subgroup: true
  use_geometric_product: true
  mix_mvpseudoscalar_into_scalar: true
  zero_bivector: false
train: true
training:
  iterations: 150000
  train_test_val:
  - 0.4
  - 0.5
  - 0.1
  subsample: null
  es_patience: 100000000
  es_load_best_model: true
  validate_every_n_steps: 1000
  save_intermediate: false
  load_best_previous: false
  save_gradients: false
  save_weights: false
  save_preds_intermediate: false
  get_ID: false
  clip_grad_norm: 5
  clip_grad_value: null
  max_grad_norm: null
  log_every_n_steps: 1000
  optimizer: AdamW
  lr: 0.01173787
  batchsize: 2048
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0
  scheduler: CosineAnnealingLR
  scheduler_scale: 1
  cosanneal_warmup_steps: 0
  cosanneal_warmup_frac: 0.003052074
  cosanneal_eta_min: 0
  reduceplateau_factor: 0.1
  reduceplateau_patience: 50
  onecycle_max_lr: 10
  onecycle_pct_start: 0.3
  ema_decay: 0.99
  float16: false
  enable_flash_sdp: false
  enable_math_sdp: true
  enable_mem_efficient_sdp: false
  force_xformers: false
  loss: HETEROSC
  dtype: float32
  regularization: L2
  regularization_lambda: 0.0004069616
  mae_to_het_transition_frac: 1.0
  output_weights: null
evaluate: true
evaluation:
  batchsize: 1024
plot: true
plotting:
  loss: true
  histograms: true
  delta: true
  delta_prepd: true
mlflow:
  db: ${base_dir}/runs/${exp_name}/mlflow/mlflow.db
  artifacts: ${base_dir}/runs/${exp_name}/mlflow_artifacts
data:
  dataset:
  - 1911.12606-EWKinos-merged-big-tuned-corr-nll350delta100
  data_path: ${oc.env:PROJECT_DIR,.}/data/
  subsample: null
  include_permsym: true
  train_test_val:
  - 0.4
  - 0.5
  - 0.1
  no_props: false
  trafos:
    fvs_standardized:
    - log_w_negatives
    - standardization
  nLL_trafos:
    per_output:
    - - log_w_negatives
      - standardization
    - - asinh
      - standardization
    - - log_w_negatives
      - standardization
    - - log_w_negatives
      - standardization
    asinh_scale: 1.006609
  incl_fvs: true
  target_indices: null
run_idx: 0
