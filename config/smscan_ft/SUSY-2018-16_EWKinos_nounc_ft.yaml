# Fine-tune of ATLAS-SUSY-2018-16_EWKinos_V1_20260910_NoSigUnc (runs/release_v2/SUSY-2018-16_EWkinos_obs40cut) on W. Waltenberger's
# simplified-model scan without signal uncertainty of 2026-11-25 (data/sm_scans_20261125/1816wzoff_nosiguncert.csv), rows inside the
# base model's training box (tools/convert_sm_scan.py --in-box), plus a 10% replay of its own train/val
# (1911.12606-EWKinos-1M-z4-nll400-delta200-obs40cut; tools/build_finetune_dataset.py --old-frac 0.1). Everything as the base run except: warm start
# from its checkpoint, normalisation pinned to the published file, constant lr = base peak lr / 10
# (0.006744178 -> 0.0006744178), 20k steps, validation every 500, get_ID off (needs data.subsample, null for a presplit set). Loss HETEROSC (the base run's MAE_TO_HETEROSC ended on it; asked and answered before running).
exp_name: smscan_ft
exp_type: nLLs
run_name: SUSY-2018-16_EWKinos_nounc_ft
base_dir: ${oc.env:PROJECT_DIR,.}
jobid: null
seed: null
debug: false
warm_start_idx: 0
run_dir: null
save: true
use_mlflow: false
save_source: true
ema: false
ga_settings:
  use_fully_connected_subgroup: true
  use_geometric_product: true
  mix_mvpseudoscalar_into_scalar: true
  zero_bivector: false
train: true
training:
  iterations: 20000
  train_test_val:
  - 0.4
  - 0.5
  - 0.1
  subsample: null
  es_patience: 100000000
  es_load_best_model: true
  validate_every_n_steps: 500
  save_intermediate: false
  load_best_previous: true
  save_gradients: false
  save_weights: false
  save_preds_intermediate: false
  get_ID: false
  clip_grad_norm: 5
  clip_grad_value: null
  max_grad_norm: null
  log_every_n_steps: 1000
  optimizer: AdamW
  lr: 0.0006744178
  batchsize: 2048
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0
  scheduler: null
  scheduler_scale: 1
  cosanneal_warmup_steps: 0
  cosanneal_warmup_frac: 0.1114259
  cosanneal_eta_min: 0
  reduceplateau_factor: 0.1
  reduceplateau_patience: 50
  onecycle_max_lr: 10
  onecycle_pct_start: 0.3
  ema_decay: 0.99
  float16: false
  enable_flash_sdp: false
  enable_math_sdp: true
  enable_mem_efficient_sdp: false
  force_xformers: false
  loss: HETEROSC
  dtype: float32
  regularization: L2
  regularization_lambda: 1.761463e-12
  mae_to_het_transition_frac: 1.0
  output_weights:
  - 1.0
  - 4.0
  - 1.0
  - 1.0
evaluate: true
evaluation:
  batchsize: 1024
plot: true
plotting:
  loss: true
  histograms: true
  delta: true
  delta_prepd: true
mlflow:
  db: ${base_dir}/runs/${exp_name}/mlflow/mlflow.db
  artifacts: ${base_dir}/runs/${exp_name}/mlflow_artifacts
model:
  _target_: wrappers.AmplitudeMLPWrapper
  net:
    _target_: models.mup_mlp.MuMLP
    n_features: 44
    hidden_channels: 64
    hidden_layers: 5
    out_shape: 4
    loss: HETEROSC
    gain: 1
    init_bias: true
    dropout_prob: 0
    batchnorm: false
    BN_eps: 1.0e-05
    BN_momentum: 0.01685803
    activation: gelu
    num_groups: 1
    type_token_list:
    - 0
data:
  dataset:
  - 1911.12606-EWKinos-nounc-smscan-box-ft
  data_path: ${oc.env:PROJECT_DIR,.}/data
  subsample: null
  include_permsym: true
  train_test_val:
  - 0.4
  - 0.5
  - 0.1
  no_props: false
  trafos:
    fvs_standardized:
    - standardization
  nLL_trafos:
  - log_w_negatives
  - standardization
  incl_fvs: true
  target_indices: null
  fixed_stats_onnx: ${oc.env:PROJECT_DIR,.}/models_onnx/olll/ATLAS-SUSY-2018-16_EWKinos_V1_20260910_NoSigUnc.onnx
run_idx: 0
warm_start_dir: ${oc.env:PROJECT_DIR,.}/runs/release_v2/SUSY-2018-16_EWkinos_obs40cut
