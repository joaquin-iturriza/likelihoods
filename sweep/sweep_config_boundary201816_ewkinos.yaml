cluster:
  auto_submit: false
  gpus_minimum_memory: 4000
  job_flavour: tomorrow
  request_gpus: 1
  requirements: '!regexp("MIG", TARGET.GPUs_DeviceName)'
  priority: 10
  request_memory: 16000

paths:
  afs_sweep_dir: /afs/cern.ch/user/j/joiturri/likelihoods/sweeps
  eos_sweep_dir: /eos/user/j/joiturri/likelihoods/sweeps
  project_dir: /eos/user/j/joiturri/likelihoods
  python_env: /eos/user/j/joiturri/jitu/amplitude_DSI/amplitudes_env/bin/activate

sweep_name: boundary201816_ewkinos_001
n_trials: 20

# Fresh model for the ATLAS-SUSY-2018-16 *EWkino* channel on the new collaborator
# boundary scan, deduplicated (176756 -> 157964 rows; the raw file repeats ~10.6%
# of rows, including the signal-free anchor 68 times, which would otherwise
# straddle the random train/val/test split).
#
# This scan is deliberately NOT the old 1911.12606-EWKinos sampling: it is
# concentrated in a narrow band around the sensitivity boundary (91.6% of points
# at 3 < Z < 5, vs the old data spreading delta_exp out to ~250), with a thin
# high-signal tail (0.3% at Z > 10, delta_exp up to ~2095). Trained standalone —
# no old rows mixed in.
#
# Structure copied from winobino_minus_preproc_001; the only deltas are the
# dataset, the base config (nLLs_C, see below) and the objective.
config_name: nLLs_C

# Relative error against the ABSOLUTE nLL at mu=1 (nLL_obs_mu0 + delta), not
# against the delta. 96.7% of this scan's obs deltas are negative with a median
# of -5.6 and a dense crossing of zero, so a delta-relative metric would be
# dominated by near-zero denominators. The baseline is O(250-280), so this
# denominator is never near 0 and every val row counts.
observe_metric: val_rel_err_nll_obs_med

dyhpo:
  n_candidates: 300
  seed: 42
  n_startup: 10
  total_budget: 10000

# 63185 train rows at batchsize 2048 is ~31 batches/epoch, so 200k steps is
# ~6500 epochs — the same epoch budget winobino_minus_preproc_001 used.
fidelity_schedule:
  t_steps: [200000]

fixed_params:
  # --- data ---
  data.data_path: /eos/user/j/joiturri/likelihoods/data/
  data.dataset: '[1911.12606-EWKinos-158k-boundaryscan]'
  data.subsample: null
  data.incl_fvs: 'true'
  data.include_permsym: 'true'
  # --- model: mup_mlp defaults are already gelu / dropout_prob=0 / batchnorm=false;
  #     width and depth pinned to the deployed EWkino model for comparability ---
  model: mup_mlp
  model.net.hidden_channels: 64
  model.net.hidden_layers: 5
  # --- training ---
  training.loss: HETEROSC
  training.batchsize: 2048
  training.optimizer: AdamW
  training.scheduler: CosineAnnealingLR
  training.cosanneal_warmup_steps: 0         # overridden by cosanneal_warmup_frac (swept)
  training.cosanneal_eta_min: 0
  training.regularization: L2
  training.validate_every_n_steps: 1000      # 200 validations per trial
  training.es_patience: 100000000            # DyHPO controls stopping via fidelity
  training.es_load_best_model: 'true'
  training.get_ID: 'false'
  training.save_preds_intermediate: 'false'
  training.save_intermediate: 'false'
  plot: 'true'

# Activation, loss, dropout and batchnorm are deliberately NOT in the search
# space — they are fixed above.
search_space:
- name: training.lr
  type: float_log
  low: 1.0e-04
  high: 5.0e-02
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-11
  high: 1.0e-02
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.0
  high: 0.15
# linear<->log transition scale of the obs asinh transform. The bulk of this
# channel's obs delta sits at |delta| ~ 1-15 (p10 -10.2, p90 -1.6), so the
# useful crossover is around there.
- name: data.nLL_trafos.asinh_scale
  type: float_log
  low: 1.0
  high: 20.0
